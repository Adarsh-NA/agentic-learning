generate_toc:
  description: |
    Analyze the **"{subject}"** and create a complete Table of Contents (TOC)
    that can be delivered professionally over **{duration} total hours** of training.
    The TOC must be logical, structured, and cover the most important topics effectively
    within the allocated duration.
    Add hands-on sessions wherever necessary for subjects which need hands on practice.

  expected_output: |
    {
      "success": true | false,
      "message": "string",
      "raw_toc_path": "string | null"
    }
  agent: toc_researcher
  output_file: "{toc_dir_path}/{subject}_{duration}hrs_research.json"

format_toc:
  description: >
      Format the toc generated by toc_researcher to a markdown file.
      Follow these mandatory rules while generating the Table of Contents (TOC):

      1. Output **ONLY** a Markdown table — no paragraphs before or after.
      2. Table must include **exactly 3 columns**:
          - Topic
          - Subtopics (bulleted)
          - Duration (hours)

      3. Use HTML `<br>` tags for each bullet under Subtopics column.
        Example:
          <br>- Subtopic A <br>
          - Subtopic B <br>
          - Subtopic C <br>

      4. Ensure total duration across all rows ≈ {duration} hours.
        - Distribute time logically across topics.

      5. Follow a hierarchical learning flow:
        Foundational → Intermediate → Advanced

      6. Include **at least one subtopic** for each Topic.
        Avoid empty cells.

      7. Table format must match EXACT example structure below:

        | Topic | Subtopics (bulleted) | Duration (hours) |
        |-------|---------------------|------------------|
        | Introduction (Example) | <br>- Concept A <br> - Concept B <br> | 2 |
        | Topic 2 (Example) | <br>- Concept C <br> - Concept D<br> | 4 |

      8. Do not add extra commentary, explanations, numbering, or markdown beyond the table.
      9. No verification step and **no repeated attempts** — produce only one output.
      10. Ensure professional instructional clarity suitable for corporate or academic training.

  expected_output: >
    {
      "success": true | false,
      "message": "string",
      "toc_path": "string | null"
    }
  agent: toc_formatter
  output_file: "{toc_dir_path}/{subject}__{duration}hrs_toc.md"

collect_transcripts:
  description: |
    Use the YouTube scraping agent to collect transcripts for the top 5 
    most-viewed long duration videos related to "{subject}". 
    The YouTube tool will save transcripts itself, and return only the 
    success status and file path of the saved JSON.
    Ask youtube_tool to save the transcripts at {transcripts_dir_path}
  expected_output: |
    {
      "success": true | false,
      "message": "string",
      "transcript_path": "string | null"
    }
  agent: youtube_scraper

  
