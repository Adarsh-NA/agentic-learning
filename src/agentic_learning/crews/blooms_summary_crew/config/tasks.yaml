full_summarisation_task:
  agent: full_summarisation_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Read the input text and generate a condensed, coherent, and well-structured Markdown summary.
    Preserve **all original information** without adding, removing, or inventing content.
    You may reorganize and condense sentences, restructure paragraphs, and enhance readability for clarity.
  expected_output: |
    A condensed, well-organized, readable Markdown summary of the transcription chunk.
    It must include **all information from the original text**, just presented more clearly in Markdown format.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_condensed.md"
  markdown: True

understanding_task:
  agent: understanding_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Focus on the fundamental concepts and principles in the transcription. Extract key terms,
    provide precise definitions, illustrate core ideas with analogies, map relationships between concepts
    in a simplified conceptual mind map, and generate reflection questions that enhance understanding
    of the subject itself.
  expected_output: |
    Key terms with definitions, analogies, concept mind map, reflection questions.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_understand.md"
  markdown: True

remember_task:
  agent: remember_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Generate aids to help remember the key concepts, focusing on **subject properties**. Produce mnemonics,
    concise flashcards, illustrative stories, and acronyms that emphasize the core principles.
  expected_output: |
    Mnemonics, flashcards, short story, acronyms emphasizing conceptual retention.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_remember.md"
  markdown: True

analyse_task:
  agent: analyse_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Perform conceptual analysis. Keep focused on the subject discussed not on the content delivery style.
    With subject discussed in focus, highlight observations, outline concept hierarchy, compare related ideas,
    note cross-references, and extract insights that explain **the subject itself**.
  expected_output: |
    Observations, concept hierarchy, comparisons, cross-references, insights emphasizing subject understanding.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_analyze.md"
  markdown: True

evaluate_task:
  agent: evaluate_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Evaluate the concepts presented. Identify advantages, limitations, suggest improvements or extensions,
    and provide expert opinions **about the subject itself**, not the lecture. Return empty data types if missing.
  expected_output: |
    Advantages, limitations, improvement suggestions, expert opinion on the subject.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_eval.md"
  markdown: True

apply_task:
  agent: apply_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Generate applied exercises that strengthen understanding of the subject. Formulate why/who/what/how/when/where/which questions,
    MCQs, and scenario-based tasks **focused on the concepts themselves**. Use empty data types if missing.
  expected_output: |
    Wh-questions, MCQs, scenario-based exercises emphasizing conceptual application.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_apply.md"
  markdown: True

create_task:
  agent: create_agent
  description: >
    transcription chunk:```{transcription_chunk}```\n
    Generate innovative outputs exploring conceptual extensions. Suggest new project ideas,
    alternative approaches, or novel applications **based on subject principles**. If any field is missing return appropriate empty datatype.
  expected_output: |
    New project ideas, creative perspectives, applications emphasizing conceptual exploration.
  output_file: "{blooms_summary_dir_path}/{video_title}_{chunk_number}_create.md"
  markdown: True


