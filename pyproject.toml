[project]
name = "agentic_learning"
version = "0.1.0"
description = "agentic_learning using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.4.1",
    "pydantic>=2.12.4",
    "python-pptx>=1.0.2",
    "yt-dlp>=2025.11.12",
]

[project.scripts]
kickoff = "agentic_learning.main:kickoff"
run_crew = "agentic_learning.main:kickoff"
plot = "agentic_learning.main:plot"
run_with_trigger = "agentic_learning.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
